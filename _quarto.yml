project:
  type: book
  output-dir: docs

number-depth: 2

book:
  author: ["Elma M.", "Jack D.", "Thusa"]
  date: today
  date-format: full
  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  cookie-consent:
    type: implied
    style: simple

  sidebar:
    title: "Rent & Roster"
    logo: assets/sidebar-logo.png
    logo-alt: "Rent & Roster logo"
    collapse-level: 2
    style: "docked"
    pinned: true
    search: true

  chapters:
    - index.qmd

    - part: "EDA"
      chapters:
        - eda/eda-member1.qmd
        - eda/eda-member2.qmd
        - eda/eda-member3.qmd

  appendices:
    - appx/proposal.qmd
    - appx/case-study.qmd
    - wa/wa-member1.qmd
    - wa/wa-member2.qmd
    - wa/wa-member3.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    search: true
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    css: style/custom.css
    fontsize: 1em
    smooth-scroll: true
    code-overflow: scroll
    code-copy: true
    code-link: true
    code-line-numbers: true
    code-block-bg: true
    code-block-border-left: "#1482FA"
    code-tools: true
    page-layout: full
    code-fold: true
    number-sections: false
    toc-expand: true

execute:
  echo: true
  warning: false
  error: false
  cache: false

editor:
  mode: source
  markdown:
    wrap: sentence
